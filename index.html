<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anesthesia Procedure Reference</title>
<style>
  :root{
    --bg:#f4f1ea; --panel:#fffefb; --ink:#1c2733; --muted:#5c6b7a;
    --line:#d9d2c4; --accent:#7c2d12; --accent2:#0f5132; --flag:#7c2d12;
    --flagbg:#fbeae5; --chip:#ece6d8; --shadow:0 1px 2px rgba(28,39,51,.06),0 8px 24px rgba(28,39,51,.06);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:"Avenir Next","Segoe UI",system-ui,sans-serif;
  }
  [data-theme="dark"]{
    --bg:#14181d; --panel:#1c2228; --ink:#e8eaed; --muted:#9aa7b4;
    --line:#2c343d; --accent:#f0a868; --accent2:#7fd1a4; --flag:#ff9d8a;
    --flagbg:#2a1c18; --chip:#262e36; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
  /* sidebar */
  .side{border-right:1px solid var(--line);background:var(--panel);position:sticky;top:0;
    height:100vh;overflow-y:auto;padding:20px 0}
  .brand{padding:0 22px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .brand h1{font-family:var(--serif);font-size:20px;margin:0;letter-spacing:.2px}
  .brand .sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:4px}
  .searchbox{padding:12px 18px}
  .search-wrap{position:relative}
  .searchbox input{width:100%;padding:9px 30px 9px 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--ink);font-size:13px;font-family:var(--sans)}
  .searchbox input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;
    background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;
    padding:2px 6px;border-radius:6px;display:none}
  .search-clear:hover{background:var(--chip);color:var(--ink)}
  .search-clear.show{display:block}
  .navgroup{margin:2px 0}
  .navgroup>.gh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
    color:var(--accent2);padding:9px 22px;display:flex;justify-content:space-between;align-items:center;
    cursor:pointer;user-select:none}
  .navgroup>.gh:hover{background:var(--chip)}
  .navgroup>.gh .chev{transition:transform .18s ease;font-size:10px;color:var(--muted)}
  .navgroup.collapsed>.gh .chev{transform:rotate(-90deg)}
  .navgroup .gh .count{font-size:10px;color:var(--muted);font-weight:600;margin-left:auto;margin-right:8px}
  .navgroup .items{overflow:hidden;max-height:2000px;transition:max-height .22s ease}
  .navgroup.collapsed .items{max-height:0}
  .navitem{display:block;padding:6px 22px;font-size:13px;color:var(--ink);cursor:pointer;
    border-left:3px solid transparent;text-decoration:none}
  .navitem:hover{background:var(--chip)}
  .navitem.active{border-left-color:var(--accent);background:var(--chip);font-weight:600}
  .navitem .pg{float:right;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  /* main */
  .main{padding:34px 44px 80px;max-width:920px}
  .topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;
    padding:7px 12px;font-size:12px;cursor:pointer;font-family:var(--sans)}
  .btn:hover{border-color:var(--accent)}
  /* welcome */
  .welcome h2{font-family:var(--serif);font-size:32px;margin:.2em 0}
  .welcome p{color:var(--muted);max-width:60ch}
  .stat{display:inline-flex;gap:6px;align-items:baseline;margin-right:26px}
  .stat b{font-family:var(--serif);font-size:26px;color:var(--accent)}
  .stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  /* procedure */
  .proc-head{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--accent2);font-weight:700}
  .proc-head h2{font-family:var(--serif);font-size:30px;margin:6px 0 8px;line-height:1.15}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{background:var(--chip);border-radius:999px;padding:3px 11px;font-size:11px;font-weight:600;
    letter-spacing:.3px}
  .pageref{font-size:12px;color:var(--muted);margin-left:auto}
  .snapshot{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0}
  .snap-cell{background:var(--panel);padding:11px 14px}
  .snap-cell .k{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .snap-cell .v{font-size:14px;font-weight:600;margin-top:2px}
  .flags{background:var(--flagbg);border:1px solid var(--flag);border-left-width:4px;
    border-radius:8px;padding:14px 18px;margin:18px 0}
  .flags .fh{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--flag);
    font-weight:800;margin-bottom:8px}
  .flags ul{margin:0;padding-left:18px}
  .flags li{margin:5px 0;font-size:14px}
  .pillars{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0}
  .pillar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;
    box-shadow:var(--shadow)}
  .pillar h3{font-family:var(--serif);font-size:16px;margin:0 0 8px;color:var(--accent)}
  .pillar ul{margin:0;padding-left:18px}
  .pillar li{margin:5px 0;font-size:13.5px}
  .pillar.tech .sum{font-size:13.5px;color:var(--muted);margin:0 0 10px;font-style:italic}
  .phases{margin:22px 0}
  .phases h3{font-family:var(--serif);font-size:18px;border-bottom:1px solid var(--line);
    padding-bottom:6px}
  .phase-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:12px}
  .phase{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .phase .ph{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:8px}
  .phase.pre .ph{color:#b45309}.phase.intra .ph{color:var(--accent2)}.phase.post .ph{color:#5b21b6}
  [data-theme="dark"] .phase.pre .ph{color:#f0a868}
  [data-theme="dark"] .phase.post .ph{color:#c4a7f0}
  .phase ul{margin:0;padding-left:16px}.phase li{margin:5px 0;font-size:13px}
  .source{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;
    margin-top:24px;font-style:italic}
  /* figures */
  .figures-block{margin:22px 0 4px}
  .figures-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
    border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 16px;
    font-family:var(--serif);font-size:15px;color:var(--accent)}
  .figures-toggle:hover{border-color:var(--accent)}
  .figures-toggle .fc{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--sans);
    text-transform:uppercase;letter-spacing:1px}
  .figures-toggle .fchev{transition:transform .18s ease;font-size:11px;color:var(--muted)}
  .figures-block.open .figures-toggle .fchev{transform:rotate(90deg)}
  .figures-grid{display:none;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:14px}
  .figures-block.open .figures-grid{display:grid}
  .figure{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
  .figure img{width:100%;display:block;background:#fff;cursor:zoom-in}
  .figure figcaption{font-size:11.5px;color:var(--muted);padding:8px 12px;line-height:1.4}
  .fig-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;
    justify-content:center;z-index:100;padding:30px;cursor:zoom-out}
  .fig-lightbox.show{display:flex}
  .fig-lightbox img{max-width:95%;max-height:92%;background:#fff;border-radius:6px}
  @media(max-width:860px){ .figures-grid{grid-template-columns:1fr} }
  mark{background:rgba(240,168,104,.4);color:inherit;border-radius:2px}
  @media(max-width:860px){
    .wrap{grid-template-columns:1fr}
    .side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
    .main{padding:22px 18px 60px}
    .snapshot,.phase-grid{grid-template-columns:1fr 1fr}
    .pillars{grid-template-columns:1fr}
  }
</style>
</head>

        "Implant graft; wean from CPB supporting the denervated heart with chronotropes/inotropes and the RV against pulmonary HTN (inhaled vasodilators).",
        "Give immunosuppression per protocol (methylprednisolone 500 mg after protamine); reverse heparin; achieve hemostasis.",
        "Transfer ventilated to ICU on inotropic/vasodilator support."
      ]
    },
    physiology: [
      "Denervated graft: no reflex HR response; rate/output depend on preload and circulating catecholamines; atropine ineffective.",
      "Chronically elevated recipient PVR can precipitate acute RV failure of the new heart.",
      "End-stage recipients have minimal reserve and are often anticoagulated/on mechanical support."
    ],
    comorbid: [
      "End-stage cardiomyopathy/CHD; prior sternotomy/VAD (redo bleeding); hepatic/renal congestion.",
      "Pulmonary hypertension severity predicts RV trouble.",
      "Immunosuppressed; infection and bleeding risks."
    ],
    phases: {
      pre: [
        "Assess native support (inotropes/IABP/LVAD), PVR/RV, end-organ congestion; treat as urgent/full-stomach.",
        "Full invasive monitoring + rapid-transfusion setup; confirm immunosuppression protocol and donor timing.",
        "Ready chronotropes/inotropes and inhaled pulmonary vasodilators."
      ],
      intra: [
        "Support failing native circulation to CPB; manage graft implantation on pump.",
        "Wean supporting the denervated heart (isoproterenol/epinephrine, pacing) and RV (inhaled NO/prostacyclin).",
        "Immunosuppression per protocol; correct coagulopathy/blood loss; maintain sterility."
      ],
      post: [
        "ICU ventilated on inotrope/vasodilator support; monitor for RV failure, rejection, bleeding, arrhythmia.",
        "Maintain immunosuppression; cautious drug choices for the denervated heart.",
        "Sternotomy analgesia; infection surveillance."
      ]
    },
    source: "Jaffe 5e (2014), Cardiovascular Surgery §6.1, Heart and Heart/Lung Transplantation, p. 464–472 (CPB per §6.1 p.348+)."
  }
];

/* ============================================================
   RENDERER — stable. Do not edit to add data (see project_instructions.md).
   ============================================================ */
function mdBold(s){ return String(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); }

/* FIGURES: manifest of extracted figures keyed by section-id. Populated by the
   build (figures/figures.json is inlined here at bundle time). Each entry:
   {file, caption, page, figref}. Figures are mapped to a procedure when the
   figure's book page falls within the procedure's page range. Stored in a
   /figures/ folder alongside index.html (referenced by relative path). */
const FIGURES = window.__FIGURES__ || {};
// map a section name -> section-id used in the manifest/filenames
function sectionId(section){
  return (section||"").toLowerCase()
    .replace(/—/g,"-").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")
    .split("-")[0]; // first token, matches how figures were extracted (e.g. "neurosurgery")
}
// parse a procedure page string ("4–14", "37–43", "134") into [lo,hi]
function pageRange(pg){
  const nums = String(pg||"").match(/\d+/g);
  if(!nums) return null;
  const ns = nums.map(Number);
  return [Math.min(...ns), Math.max(...ns)];
}
// figures whose book-page falls in this procedure's range
function figuresFor(p){
  const sid = sectionId(p.section);
  const list = FIGURES[sid];
  if(!list || !list.length) return [];
  const rng = pageRange(p.page);
  if(!rng) return [];
  // manifest 'page' is the PDF-slice page index, not the book page — but figures
  // were extracted from the same slice in reading order, so we fall back to
  // matching by figref chapter-section when page mapping is unavailable.
  // Primary: if a figref like "Figure 1.1-1" exists, match its middle number to
  // nothing reliable; so we use a simple heuristic — show figures whose figref
  // section prefix matches AND that haven't been claimed. To keep it robust and
  // avoid mis-assignment, we match on book-page when the manifest carries it.
  return list.filter(f => f.bookPage != null && f.bookPage >= rng[0] && f.bookPage <= rng[1]);
}

let activeId = null;
let query = "";
// sections the user has manually expanded/collapsed; default = collapsed (except active)
const expandedSections = new Set();

// Lightweight anesthesia abbreviation/synonym map for search.
// Typing either side finds the other (e.g. "AAA" finds "abdominal aortic aneurysm").
const SYNONYMS = [
  ["aaa","abdominal aortic aneurysm"],
  ["olv","one-lung ventilation","one lung"],
  ["cpb","cardiopulmonary bypass"],
  ["dlt","double-lumen tube","double lumen"],
  ["geta","general endotracheal anesthesia","general anesthesia"],
  ["tavr","tavi","transcatheter aortic valve"],
  ["mac","monitored anesthesia care"],
  ["rsi","rapid sequence induction","rapid-sequence"],
  ["osa","obstructive sleep apnea","sleep apnea","sleep-disordered breathing"],
  ["dhca","deep hypothermic circulatory arrest","circulatory arrest"],
  ["vae","venous air embolism","air embolism"],
  ["cabg","coronary artery bypass","coronary bypass"],
  ["icp","intracranial pressure"],
  ["iop","intraocular pressure"],
  ["foi","fol","fiberoptic intubation","awake fiberoptic"],
  ["evar","endovascular","stent-graft","stent graft"],
  ["mg","myasthenia","myasthenia gravis"],
  ["nmb","neuromuscular block","muscle relaxant","paralytic"],
  ["tee","transesophageal echo"],
  ["as","aortic stenosis"],
  ["ar","aortic regurgitation"],
  ["ms","mitral stenosis"],
  ["mr","mitral regurgitation"],
  ["dcr","dacryocystorhinostomy"],
  ["tmj","temporomandibular joint"],
  ["uppp","uvulopalatopharyngoplasty"],
  ["dbs","deep brain stimulation"],
  ["vns","vagus nerve stimulation"],
  ["ent","otolaryngology","head and neck"],
  ["sah","subarachnoid hemorrhage"],
  ["povl","postoperative visual loss","ischemic optic"]
];

// expand a raw query into the set of terms to match (adds synonym group members)
function expandTerms(q){
  const raw = q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const out = new Set(raw);
  for(const term of raw){
    for(const group of SYNONYMS){
      if(group.includes(term)){ group.forEach(g=>out.add(g)); }
    }
  }
  return [...out];
}

const PILLARS = [
  {key:"physiology", title:"Physiology & Pathophysiology"},
  {key:"comorbid",   title:"Patient & Comorbidities"}
];

function groupBySection(list){
  const g = {};
  for(const p of list){ (g[p.section] = g[p.section] || []).push(p); }
  return g;
}

// Returns a relevance score for procedure p against the expanded term list.
// 0 = no match. Higher = better. Title hits >> tag hits >> body hits.
function scoreMatch(p, terms){
  if(!terms.length) return 1; // empty query: everything shows, neutral score
  const name = (p.name||"").toLowerCase();
  const tags = (p.tags||[]).join(" ").toLowerCase();
  const section = (p.section||"").toLowerCase();
  const body = [
    (p.flags||[]).join(" "), JSON.stringify(p.snapshot||{}),
    (p.physiology||[]).join(" "), (p.comorbid||[]).join(" "),
    p.technique && p.technique.summary,
    p.phases && [p.phases.pre,p.phases.intra,p.phases.post].flat().join(" ")
  ].join(" ").toLowerCase();

  let total = 0;
  // every ORIGINAL term must match somewhere (AND semantics on the typed words);
  // synonyms broaden where a term can be found. We approximate by requiring each
  // raw token OR one of its synonyms to hit; scoring rewards title/tag location.
  for(const t of terms){
    let s = 0;
    if(name.includes(t)){ s = name.startsWith(t) ? 100 : 60; }
    else if(tags.includes(t)){ s = 30; }
    else if(section.includes(t)){ s = 20; }
    else if(body.includes(t)){ s = 8; }
    if(s > total) total = s; // best single-term hit drives the rank
  }
  // require at least one hit
  return total;
}

function filterAndRank(){
  const terms = expandTerms(query);
  if(!terms.length) return PROCEDURES.map(p=>({p,score:1}));
  return PROCEDURES
    .map(p=>({p,score:scoreMatch(p,terms)}))
    .filter(x=>x.score>0)
    .sort((a,b)=> b.score-a.score);
}

function renderNav(){
  const nav = document.getElementById("nav");
  const ranked = filterAndRank();
  const searching = !!query.trim();
  let html = "";

  if(searching){
    // FLAT, ranked list when searching — best hits first, no section grouping
    if(!ranked.length){
      html = `<div style="padding:18px 22px;color:var(--muted);font-size:13px">No matches.</div>`;
    } else {
      html += `<div class="navgroup"><div class="items">`;
      for(const {p} of ranked){
        html += `<a class="navitem ${p.id===activeId?"active":""}" data-id="${p.id}">`+
                `${p.name}<span class="pg">p.${p.page}</span></a>`;
      }
      html += `</div></div>`;
    }
  } else {
    // GROUPED, accordion list when browsing — sections collapsed by default
    const groups = groupBySection(PROCEDURES);
    for(const section of Object.keys(groups)){
      const items = groups[section];
      const hasActive = items.some(p=>p.id===activeId);
      const open = expandedSections.has(section) || hasActive;
      html += `<div class="navgroup ${open?"":"collapsed"}" data-section="${section}">`+
              `<div class="gh" data-toggle="${section}">`+
              `<span>${section}</span><span class="count">${items.length}</span>`+
              `<span class="chev">▼</span></div>`+
              `<div class="items">`;
      for(const p of items){
        html += `<a class="navitem ${p.id===activeId?"active":""}" data-id="${p.id}">`+
                `${p.name}<span class="pg">p.${p.page}</span></a>`;
      }
      html += `</div></div>`;
    }
  }
  nav.innerHTML = html;

  nav.querySelectorAll(".navitem").forEach(el=>{
    el.addEventListener("click",()=>{ select(el.dataset.id); });
  });
  // section header toggles (accordion: opening one closes the others)
  nav.querySelectorAll(".gh[data-toggle]").forEach(el=>{
    el.addEventListener("click",()=>{
      const sec = el.dataset.toggle;
      if(expandedSections.has(sec)){
        expandedSections.delete(sec);
      } else {
        expandedSections.clear();   // accordion behavior
        expandedSections.add(sec);
      }
      renderNav();
    });
  });
}

function renderWelcome(){
  const sections = [...new Set(PROCEDURES.map(p=>p.section))];
  document.getElementById("content").innerHTML = `
    <div class="welcome">
      <div class="eyebrow">Case Preparation Reference</div>
      <h2>What does this surgery mean for my anesthetic?</h2>
      <p>Distilled from <i>Jaffe's Anesthesiologist's Manual of Surgical Procedures</i>,
         5th edition. Each entry leads with the can't-miss flags, then the snapshot,
         physiology, comorbidities, and a pre / intra / post plan.</p>
      <div style="margin:26px 0">
        <span class="stat"><b>${PROCEDURES.length}</b><span>procedures</span></span>
        <span class="stat"><b>${sections.length}</b><span>sections</span></span>
      </div>
      <p style="font-size:13px">Tap a section on the left to expand it, or search by name, tag,
         abbreviation, or flag (e.g. <i>crani</i>, <i>AAA</i>, <i>OLV</i>, <i>airway</i>).</p>
    </div>`;
}

function renderProcedure(p){
  const snap = p.snapshot;
  const snapCells = [
    ["Position",snap.position],["Time",snap.time],["EBL",snap.ebl],
    ["Pain",snap.painScore],["Anesthesia",snap.anesthesia],["Mortality",snap.mortality]
  ].map(([k,v])=>`<div class="snap-cell"><div class="k">${k}</div><div class="v">${mdBold(v||"—")}</div></div>`).join("");

  const flags = (p.flags||[]).map(f=>`<li>${mdBold(f)}</li>`).join("");
  const techSteps = (p.technique.steps||[]).map(s=>`<li>${mdBold(s)}</li>`).join("");
  const pillarHtml = PILLARS.map(pl=>{
    const items=(p[pl.key]||[]).map(x=>`<li>${mdBold(x)}</li>`).join("");
    return `<div class="pillar"><h3>${pl.title}</h3><ul>${items}</ul></div>`;
  }).join("");
  const ph = p.phases;
  const phaseHtml = [["pre","Pre-op"],["intra","Intra-op"],["post","Post-op"]].map(([k,lbl])=>{
    const items=(ph[k]||[]).map(x=>`<li>${mdBold(x)}</li>`).join("");
    return `<div class="phase ${k}"><div class="ph">${lbl}</div><ul>${items}</ul></div>`;
  }).join("");

  // figures (collapsed by default), mapped by book page
  const figs = figuresFor(p);
  let figuresHtml = "";
  if(figs.length){
    const cards = figs.map(f=>{
      const cap = f.caption || (f.figref ? f.figref : "");
      return `<figure class="figure"><img loading="lazy" src="figures/${f.file}" `+
             `alt="${(f.figref||'Figure').replace(/"/g,'')}" data-full="figures/${f.file}">`+
             (cap?`<figcaption>${cap}</figcaption>`:"")+`</figure>`;
    }).join("");
    figuresHtml = `<div class="figures-block open" id="figuresBlock">`+
      `<div class="figures-toggle" id="figuresToggle"><span class="fchev">▶</span>`+
      `<span>Figures</span><span class="fc">${figs.length} from Jaffe 5e</span></div>`+
      `<div class="figures-grid">${cards}</div></div>`;
  }

  document.getElementById("content").innerHTML = `
    <div class="proc-head">
      <div class="eyebrow">${p.section}</div>
      <h2>${p.name}</h2>
      <div class="tags">${(p.tags||[]).map(t=>`<span class="tag">${t}</span>`).join("")}
        <span class="pageref">Jaffe 5e · p. ${p.page}</span></div>
    </div>
    <div class="snapshot">${snapCells}</div>
    <div class="flags"><div class="fh">⚑ Can't-Miss Flags</div><ul>${flags}</ul></div>
    <div class="pillars">
      <div class="pillar tech"><h3>Procedure (for us)</h3>
        <p class="sum">${mdBold(p.technique.summary)}</p><ul>${techSteps}</ul></div>
      ${pillarHtml}
    </div>
    <div class="phases"><h3>Anesthetic Plan by Phase</h3>
      <div class="phase-grid">${phaseHtml}</div></div>
    ${figuresHtml}
    <div class="source">${p.source}</div>`;
  document.querySelector(".main").scrollTop = 0;

  // figures toggle + lightbox
  const fb = document.getElementById("figuresBlock");
  if(fb){
    document.getElementById("figuresToggle").addEventListener("click",()=>fb.classList.toggle("open"));
    fb.querySelectorAll(".figure img").forEach(img=>{
      img.addEventListener("click",()=>{
        const lb = document.getElementById("figLightbox");
        document.getElementById("figLightboxImg").src = img.dataset.full;
        lb.classList.add("show");
      });
    });
  }
}

function select(id){
  activeId = id;
  const p = PROCEDURES.find(x=>x.id===id);
  if(p){ renderProcedure(p); location.hash = id; }
  renderNav();
}

const searchEl = document.getElementById("search");
const clearEl = document.getElementById("searchClear");
searchEl.addEventListener("input",e=>{
  query = e.target.value;
  clearEl.classList.toggle("show", !!query);
  renderNav();
});
clearEl.addEventListener("click",()=>{
  query = "";
  searchEl.value = "";
  clearEl.classList.remove("show");
  searchEl.focus();
  renderNav();
});
document.getElementById("themeBtn").addEventListener("click",()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur==="dark"?"light":"dark");
});
document.getElementById("figLightbox").addEventListener("click",function(){
  this.classList.remove("show");
});

// initial render — honor hash deep-link
(function init(){
  renderNav();
  const h = location.hash.replace("#","");
  if(h && PROCEDURES.find(p=>p.id===h)) select(h);
  else renderWelcome();
})();
</script>
</body>
</html>
